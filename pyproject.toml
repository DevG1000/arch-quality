[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-quality"
version = "1.0.0"
description = "软件架构质量评估引擎 — 系统性分析、评估和改进软件系统架构质量，支持多语言混合依赖评估"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "arch-quality contributors"},
]
keywords = ["architecture", "quality", "assessment", "metrics", "multilang"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
arch-quality = "arch_quality.arch_report:main"
arch-quality-standard = "arch_quality.arch_metrics_standard:main"
arch-quality-multilang = "arch_quality.arch_metrics_multilang:main"
arch-quality-template = "arch_quality.arch_metrics_template:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arch_quality = ["skills/*.md"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]