# projects.yaml — H1 WP-5 回归项目清单 + H2 WP-0.5 参考样本注册（相对路径，CI 可复现）
#
# 结构：项目名 → { desc, fetch(获取方式), eval(评估配置), license(授权), note }
# - fetch.repo: 第三方源码仓库 URL（CI 通过 git clone 获取）
# - fetch.ref:  固定 git ref（refs/tags/<tag> 或 40-hex commit SHA），保证可复现获取（H2 WP-0.5）
# - fetch.method: 获取方式: shallow(浅克隆, 默认) / local(本仓库自举) / tarball
# - fetch.dir: 相对源码根目录的评估子目录（可空）
# - eval.engine: 使用的评估引擎
# - eval.snapshot: 对应回归快照
# - license: 授权方式（静态分析源码用）
# - 校验和（checksums 段）：格式 git_ref:<repo>:<commit_sha>，由 scripts/fetch_project.py 校验
#
# H2 WP-0.5 新增：occt（几何内核 GCS 样本）+ salome-geom（外部内核封装/数据交换防腐 ACL 样本）；
# 若两者获取失败（网络/授权），GCS/ACL 回归用 freecad / brl-cad 兜底基线（H2 决策 4）。

projects:
  # ── 本仓库自举（始终可用）──
  arch-quality:
    desc: arch-quality 自身（自举回归）
    fetch:
      repo: local
      dir: ""
    eval:
      engine: standard
      snapshot: standard_arch_quality
    note: 本仓库无需获取

  # ── 多语言 + 标准引擎回归项目 ──
  openfoam:
    desc: OpenFOAM CFD 求解器（多语言/标准/物理场）
    fetch:
      repo: https://github.com/OpenFOAM/OpenFOAM-dev.git
      dir: ""
    eval:
      engine: [multilang, standard, solver_physics, template]
      snapshot: [openfoam_v2512, standard_openfoam_apps, sp_openfoam, tpl_openfoam_v2512]
    note: MLR 用全库；SAR 用 applications/ 子目录
  brl-cad:
    desc: BRL-CAD 实体建模（多语言/标准/模板）
    fetch:
      repo: https://github.com/BRL-CAD/brlcad.git
      dir: ""
    eval:
      engine: [multilang, standard, template]
      snapshot: [brl_cad, standard_brl_cad, tpl_brl_cad]
    note: ""
  freecad:
    desc: FreeCAD CAD（多语言/标准/模板）
    fetch:
      repo: https://github.com/FreeCAD/FreeCAD.git
      dir: src
    eval:
      engine: [multilang, standard, template]
      snapshot: [freecad_cam, freecad_fem, standard_freecad_cam, tpl_freecad]
    note: CAM/Fem 子模块在 src/Mod/
  elmerfem:
    desc: ElmerFEM 多物理场有限元（多语言/标准/模板/物理场）
    fetch:
      repo: https://github.com/ElmerCSC/elmerfem.git
      dir: ""
    eval:
      engine: [multilang, standard, solver_physics, template]
      snapshot: [elmerfem, standard_elmerfem, sp_elmerfem, tpl_elmerfem]
    note: ""

  # ── 数值引擎回归项目 ──
  moose:
    desc: MOOSE 多物理场框架（数值/物理场）
    fetch:
      repo: https://github.com/idaholab/moose.git
      dir: ""
    eval:
      engine: [numerical, solver_physics]
      snapshot: [MOOSE, sp_moose]
    note: 大项目（45k 文件），CI 标注 slow
  dealii:
    desc: deal.II 有限元库（数值/物理场）
    fetch:
      repo: https://github.com/dealii/dealii.git
      dir: ""
    eval:
      engine: [numerical, solver_physics]
      snapshot: [deal.II, sp_dealii]
    note: 大项目（34k 文件），slow
  freefem:
    desc: FreeFEM 有限元（数值/物理场）
    fetch:
      repo: https://github.com/FreeFem/FreeFem-sources.git
      dir: ""
    eval:
      engine: [numerical, solver_physics]
      snapshot: [FreeFEM, sp_freefem]
    note: ""
  mfem:
    desc: MFEM 有限元库（数值/物理场）
    fetch:
      repo: https://github.com/mfem/mfem.git
      dir: ""
    eval:
      engine: [numerical, solver_physics]
      snapshot: [MFEM, sp_mfem]
    note: ""
  fenicsx:
    desc: FEniCSx 有限元（数值/物理场）
    fetch:
      repo: https://github.com/FEniCS/dolfinx.git
      dir: ""
    eval:
      engine: [numerical, solver_physics]
      snapshot: [FEniCSx, sp_fenicsx]
    note: 识别为非多物理场（sp 跳过）
  kratos:
    desc: Kratos 多物理场框架（物理场）
    fetch:
      repo: https://github.com/KratosMultiphysics/Kratos.git
      dir: ""
    eval:
      engine: [solver_physics]
      snapshot: [sp_kratos]
    note: ""
  su2:
    desc: SU2 航空求解器（物理场）
    fetch:
      repo: https://github.com/su2code/SU2.git
      dir: ""
    eval:
      engine: [solver_physics]
      snapshot: [sp_su2]
    note: ""
  precice:
    desc: preCICE 耦合库（物理场）
    fetch:
      repo: https://github.com/precice/precice.git
      dir: ""
    eval:
      engine: [solver_physics]
      snapshot: [sp_precice]
    note: ""

  # ── 模板引擎回归项目 ──
  eigen:
    desc: Eigen 模板库（模板）
    fetch:
      repo: https://gitlab.com/libeigen/eigen.git
      dir: ""
    eval:
      engine: [template]
      snapshot: [tpl_eigen]
    note: ""
  boost:
    desc: Boost 库（模板，mpl/gil/hana 子库）
    fetch:
      repo: https://github.com/boostorg/boost.git
      dir: ""
    eval:
      engine: [template]
      snapshot: [tpl_boost_mpl, tpl_boost_gil, tpl_hana]
    note: 子目录 libs/{mpl,gil,hana}
  folly:
    desc: Facebook Folly（模板）
    fetch:
      repo: https://github.com/facebook/folly.git
      dir: ""
    eval:
      engine: [template]
      snapshot: [tpl_folly]
    note: ""
  abseil:
    desc: Google Abseil（模板）
    fetch:
      repo: https://github.com/abseil/abseil-cpp.git
      dir: ""
    eval:
      engine: [template]
      snapshot: [tpl_abseil]
    note: ""
  range-v3:
    desc: range-v3（模板）
    fetch:
      repo: https://github.com/ericniebler/range-v3.git
      dir: ""
    eval:
      engine: [template]
      snapshot: [tpl_range_v3]
    note: ""

  # ── 几何内核 / 防腐层参考样本（H2 WP-0.5 新增，GCS/ACL 引擎 WP-2/WP-4 落地）──
  occt:
    desc: Open CASCADE Technology 几何内核（维度④ GCS 正样本，B-Rep/Handle_/STEP 数据交换）
    fetch:
      repo: https://github.com/Open-Cascade-SAS/OCCT.git
      ref: refs/tags/V8.0.1
      method: shallow
      dir: src
    eval:
      engine: [gcs, standard]
      snapshot: []
    license: LGPL-2.1 with Open CASCADE Exception 1.0
    note: "官方 GitHub mirror；浅克隆固定 tag V8.0.1 避免全历史(~2GB)；GCS 快照 WP-2 生成"
  salome-geom:
    desc: SALOME GEOM 几何模块（维度⑧ ACL 正样本，OCCT 外部封装 + STEP/IGES/BREP 防腐）
    fetch:
      repo: https://github.com/SalomePlatform/geom.git
      ref: 3f85d2e295e5d5415a0b1fe5f5e128a84d244996
      method: shallow
      dir: src
    eval:
      engine: [acl, standard]
      snapshot: []
    license: LGPL-2.1
    note: "SALOME 裁剪策略：仅几何模块（上游 git.salome-platform.org/gitpub/modules/geometry.git 官方克隆），非全平台；固定 master commit；ACL 快照 WP-4 生成"

  # ── WP-7 语料扩充（GCS/ACL 交叉验证样本）──
  gmsh:
    desc: Gmsh 网格生成器（GCS mesh_tool / ACL 数据交换样本）
    fetch:
      repo: https://gitlab.onelab.info/gmsh/gmsh.git
      method: shallow
      dir: ""
    eval:
      engine: [gcs, acl]
      snapshot: [gcs_gmsh, acl_gmsh]
    note: "WP-7 语料"
  kratos:
    desc: Kratos 多物理场（GCS multiphysics 样本）
    fetch:
      repo: https://github.com/KratosMultiphysics/Kratos.git
      method: shallow
      dir: ""
    eval:
      engine: [gcs]
      snapshot: [gcs_kratos]
    note: "WP-7 语料"
  code_aster:
    desc: Code_Aster 结构力学 FEM（GCS 样本）
    fetch:
      repo: https://gitlab.com/codeaster/src.git
      method: shallow
      dir: ""
    eval:
      engine: [gcs]
      snapshot: [gcs_code_aster]
    note: "WP-7 语料"
  mfem:
    desc: MFEM 有限元库（GCS 健康样本）
    fetch:
      repo: https://github.com/mfem/mfem.git
      method: shallow
      dir: ""
    eval:
      engine: [gcs]
      snapshot: [gcs_mfem]
    note: "WP-7 语料"
  elmerfem:
    desc: Elmer FEM（GCS/ACL 样本）
    fetch:
      repo: https://github.com/ElmerCSC/elmerfem.git
      method: shallow
      dir: ""
    eval:
      engine: [gcs, acl, standard, template]
      snapshot: [gcs_elmerfem, acl_elmerfem, standard_elmerfem, tpl_elmerfem]
    note: "WP-7 语料"
  kicad:
    desc: KiCad EDA（ACL eda 样本）
    fetch:
      repo: https://gitlab.com/kicad/code/kicad.git
      method: shallow
      dir: ""
    eval:
      engine: [acl]
      snapshot: [acl_kicad]
    note: "WP-7 语料"
  wp7_corpus:
    desc: WP-7 合成语料（gcs/acl 健康/不健康正交样本）
    fetch:
      repo: local
      dir: tests/wp7_corpus
    eval:
      engine: [gcs, acl]
      snapshot: [gcs_synth_unhealthy, acl_synth_healthy, acl_synth_direct, acl_synth_scatter]
    note: "本仓库自举，无需获取"

# 校验和：首次获取后由脚本生成（`arch-quality` 用 git 分支 commit 作为参考基准）
checksums:
  generated_by: scripts/fetch_project.py (H2 WP-0.5)
  format: "git_ref:<repo>:<commit_sha>"
  git_ref:https://github.com/Open-Cascade-SAS/OCCT.git: b8f597c677811d1f9f4d8a97f5ae2825c0353a42
  git_ref:https://github.com/SalomePlatform/geom.git: 3f85d2e295e5d5415a0b1fe5f5e128a84d244996